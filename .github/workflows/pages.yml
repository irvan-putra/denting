name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  consistency:
    # patuh source gate on the exact tree being deployed. A consistency
    # failure stops the deploy: for a web project, the Pages deploy IS the
    # release, so this is the preventive boundary. Same pinned reviewed
    # commit as the rest of the family.
    uses: irvan-putra/patuh/.github/workflows/release-gate.yml@3d9be2e1d971e3f9e3f748a2fb04931951e9f974
    with:
      app: denting
      published: false
  deploy:
    needs: consistency
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Allow artifact metadata to become visible
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
