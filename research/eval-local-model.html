<!doctype html>
<!-- Synthetic evaluation: can a small fully local (WASM/CPU) language model
     turn plain-language music edit requests into denting's structured edit
     plan, and stay honest on requests outside the vocabulary?
     Runs entirely in the browser; no keys, no accounts, no billing. -->
<html><head><meta charset="utf-8"><title>eval loading</title></head>
<body><pre id="out">starting</pre>
<script type="module">
const out = document.getElementById('out');
const log = s => { out.textContent += '\n' + s; };
const SCHEMA = `You convert a music edit request into JSON only, no other text.
Schema: {"op": one of "transpose","louder","softer","faster","slower","tempo","none",
"track": "all" or a part name, "fromBeat": integer or null, "toBeat": integer or null,
"amount": integer semitones or null, "bpm": integer or null}
Use op "none" when the request is not a note/tempo edit of existing music.`;
const CASES = [
  { q: 'make the drums louder', op: 'louder', track: 'drums' },
  { q: 'softer please', op: 'softer' },
  { q: 'transpose up 2', op: 'transpose', amount: 2 },
  { q: 'make it faster', op: 'faster' },
  { q: 'set it to 90 bpm', op: 'tempo', bpm: 90 },
  { q: 'only the bass, louder', op: 'louder', track: 'bass' },
  { q: 'slow down', op: 'slower' },
  { q: 'transpose beat 3 down 1', op: 'transpose', amount: -1, fromBeat: 3 },
  { q: 'the melody is too high, bring it down', op: 'transpose', track: 'melody' },
  { q: 'make beats 4 to 8 softer', op: 'softer', fromBeat: 4, toBeat: 8 },
  { q: 'make it sound like rain on a tin roof', op: 'none' },
  { q: 'add a saxophone solo', op: 'none' },
  { q: 'compose a new chorus', op: 'none' },
  { q: 'what key is this in?', op: 'none' },
  { q: 'make it more emotional', op: 'none' },
  { q: 'change the lyrics', op: 'none' },
];
const params = new URLSearchParams(location.search);
const MODEL = params.get('model') || 'onnx-community/SmolLM2-135M-Instruct-ONNX-MHA';
const sp = (params.get('slice') || '').split(',').map(Number);
const START = isNaN(sp[0]) ? 0 : sp[0];
const COUNT = isNaN(sp[1]) ? CASES.length : sp[1];
const RUN = CASES.slice(START, START + COUNT);
(async () => {
  const t0 = performance.now();
  try {
    log('webgpu: ' + (navigator.gpu ? (await navigator.gpu.requestAdapter() ? 'adapter' : 'no adapter') : 'absent'));
    const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3');
    env.allowLocalModels = true;
    log('library loaded at ' + Math.round(performance.now() - t0) + 'ms');
    const gen = await pipeline('text-generation', MODEL, { dtype: 'q4', device: 'wasm' });
    const tLoad = Math.round(performance.now() - t0);
    log('model ' + MODEL + ' ready at ' + tLoad + 'ms');
    let opOk = 0, fieldOk = 0, fieldTot = 0, parseOk = 0, lat = [];
    for (const [idx, c] of RUN.entries()) {
      const tq = performance.now();
      const r = await gen([{ role: 'system', content: SCHEMA }, { role: 'user', content: c.q }],
        { max_new_tokens: 160, do_sample: false });
      const ms = Math.round(performance.now() - tq); lat.push(ms);
      const text = r[0].generated_text.at(-1).content.trim();
      let parsed = null;
      const ms2 = text.match(/\{[^{}]*\}/g) || [];
      for (const m of ms2) { try { parsed = JSON.parse(m); break; } catch (e) {} }
      if (parsed) parseOk++;
      const opGood = parsed && parsed.op === c.op;
      if (opGood) opOk++;
      let det = '';
      const fields = {};
      for (const k of ['track', 'amount', 'bpm', 'fromBeat', 'toBeat']) {
        if (c[k] !== undefined) {
          fieldTot++;
          const good = parsed && parsed[k] === c[k];
          if (good) fieldOk++;
          fields[k] = { want: c[k], got: parsed ? parsed[k] : null, good };
          det += ' ' + k + ':' + (good ? 'ok' : 'want ' + c[k] + ' got ' + (parsed ? parsed[k] : 'unparsed'));
        }
      }
      log('RESULT ' + JSON.stringify({ i: START + idx, q: c.q, wantOp: c.op, parsed, opGood, fields, ms }));
      log((opGood ? 'PASS ' : 'FAIL ') + JSON.stringify(c.q) + ' -> op ' + (parsed ? parsed.op : 'unparsed') + ' (' + ms + 'ms)' + det);
    }
    lat.sort((a, b) => a - b);
    log('META ' + JSON.stringify({ model: MODEL, loadMs: tLoad, cases: RUN.length, parse: parseOk, op: opOk, fieldsOk: fieldOk, fieldsTot: fieldTot, latencyMedianMs: lat[Math.floor(lat.length / 2)], maxMs: lat[lat.length - 1] }));
    log('SUMMARY model=' + MODEL + ' loadMs=' + tLoad +
      ' parse=' + parseOk + '/' + RUN.length +
      ' op=' + opOk + '/' + RUN.length +
      ' fields=' + fieldOk + '/' + fieldTot +
      ' latencyMedianMs=' + lat[Math.floor(lat.length / 2)] + ' maxMs=' + lat[lat.length - 1]);
  } catch (e) { log('EVAL_ERROR ' + (e && e.message ? e.message : String(e))); }
  document.title = 'DONE';
})();
</script><p class="ai-disclosure" style="font:12px/1.5 system-ui,sans-serif;text-align:center;padding:12px 16px;margin:20px auto;max-width:70ch">Built with AI assistance (Instinct and others). Not everything has been reviewed by Irvan.</p>
</body></html>
